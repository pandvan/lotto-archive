name: Update archive

on:
  schedule:
    # Draws are held Tue/Thu/Fri/Sat, but upstream publication time is not
    # predictable, so a draw is only expected from the morning after. Running
    # daily is simplest and costs one conditional request on a quiet day.
    - cron: '0 5 * * *'   # 06:00 CET / 07:00 CEST
    - cron: '0 15 * * *'  # afternoon retry, in case the morning run found nothing
  workflow_dispatch:
    inputs:
      force_refetch:
        description: Ignore the stored ETag and download the primary in full
        type: boolean
        default: false
      allow_history_rewrite:
        description: Accept upstream changes to already-published draws
        type: boolean
        default: false

concurrency:
  group: archive-update
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Fetch and merge new draws
        id: update
        run: |
          python scripts/update.py \
            ${{ inputs.force_refetch && '--force-refetch' || '' }} \
            ${{ inputs.allow_history_rewrite && '--allow-history-rewrite' || '' }}

      # update.py exits non-zero after writing when the newest expected draw is still
      # overdue. The draws it did write must be validated and committed all the same;
      # the run still fails, and the failure is still reported.
      - name: Validate the archive
        id: validate
        if: ${{ !cancelled() }}
        run: python scripts/validate.py

      - name: Commit
        if: ${{ !cancelled() && steps.update.outputs.changed == 'true' && steps.validate.outcome == 'success' }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data index.json
          git diff --cached --quiet && exit 0
          git commit -m "data: add ${{ steps.update.outputs.added }} draw(s) through ${{ steps.update.outputs.last_date }}"
          git push

      - name: Report a failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Archive update failed';
            const body = [
              `The scheduled archive update failed.`,
              ``,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'automation',
            });
            const match = existing.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: match.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['automation'],
              });
            }
