name: Reconcile with fallback

on:
  schedule:
    - cron: '0 6 * * 0'   # Sundays
  workflow_dispatch:
    inputs:
      repair:
        description: Add draws the fallback has and the archive lacks
        type: boolean
        default: false

concurrency:
  group: archive-update      # never race the update job
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Cross-check every row against the fallback source
        id: reconcile
        run: python scripts/reconcile.py ${{ inputs.repair && '--repair' || '' }}

      - name: Commit repairs
        if: steps.reconcile.outputs.changed == 'true'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data index.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: reconcile with fallback source'
          git push

      - name: Open an issue on any discrepancy
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const body = [
              'The weekly reconcile found the archive and the fallback source disagree,',
              'or the fallback could not be read.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Reconcile discrepancy (${new Date().toISOString().slice(0, 10)})`,
              body, labels: ['automation', 'data-integrity'],
            });
