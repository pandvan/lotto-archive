name: Publish the statistics site

# The site is derived from the archive, so it is rebuilt whenever the archive moves
# and whenever the page itself changes. It is never committed.
#
# A push made with GITHUB_TOKEN does not start another workflow, so the daily data
# commit from "Update archive" would never reach a `push` trigger here. `workflow_run`
# is the trigger that does fire for it. Only the 10eLotto workflow is listed: it runs
# after every "Update archive" and "Reconcile with fallback", so listing those too
# published the site twice per update.
on:
  workflow_run:
    workflows: ['Derive the 10eLotto archive']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/**'
      - 'data/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Publish whatever 10eLotto concluded: main already holds the Lotto commit, and a
    # derived-archive failure must never hold it back.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # scripts/build_site.py reads the committed JSON and writes HTML and JSON; it
      # imports nothing outside the standard library, so there is nothing to install.
      - name: Build the site
        run: python scripts/build_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
